[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "datapalette"
dynamic = ["version"]
description = "Image dataset preprocessing and augmentation toolkit with scikit-learn-compatible transforms, no scikit-learn required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Juan Garassino"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "opencv-python",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
torch = ["torch", "torchvision"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "scikit-learn>=1.6"]  # sklearn only for the interop test

[project.scripts]
datapalette = "datapalette.cli:main"

[tool.hatch.version]
path = "datapalette/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["datapalette"]

[tool.hatch.build.targets.sdist]
include = ["datapalette", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.uv]
# dev-env only (not published metadata): this Intel macOS 12 machine has no wheels for
# OpenCV >= 4.11 or numpy 2 builds of it
constraint-dependencies = [
    "opencv-python<4.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless<4.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision<0.18; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
